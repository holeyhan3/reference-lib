site_name: Reference Library
site_url: https://holeyhan3.github.io/reference-lib/
site_description: Personal knowledge base and study notes
site_author: Hans
repo_name: reference-lib
repo_url: https://github.com/holeyhan3/reference-lib
docs_dir: docs
site_dir: site
use_directory_urls: true
extra_css:
- stylesheets/extra.css
theme:
  features:
  - navigation.sections
  - navigation.expand
  - navigation.indexes
  - navigation.top
  - search.highlight
  - content.code.copy
  palette:
  - media: '(prefers-color-scheme: light)'
  - scheme: default
    primary: indigo
    accent: blue
    toggle:
      icon: material/weather-sunny
      name: Light mode
  - scheme: slate
    primary: indigo
    accent: blue
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    toggle:
      icon: material/weather-night
      name: Dark mode
plugins:
- search
- roamlinks
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight
- toc:
    permalink: true
nav:
- Home: index.md
