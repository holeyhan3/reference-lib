site_name: Reference Library
site_url: https://holeyhan3.github.io/reference-lib/
site_description: Personal knowledge base and study notes
site_author: Hans
repo_name: reference-lib
repo_url: https://github.com/holeyhan3/reference-lib
docs_dir: docs
site_dir: site
use_directory_urls: true
extra_css:
- stylesheets/extra.css
theme:
  name: material
  features:
  - navigation.sections
  - navigation.indexes
  - navigation.top
  - navigation.tracking
  - search.highlight
  - search.share
  - content.code.copy
  - content.action.edit
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: blue
    toggle:
      icon: material/weather-sunny
      name: Light mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: indigo
    accent: blue
    toggle:
      icon: material/weather-night
      name: Dark mode
plugins:
- search
- roamlinks
- glightbox
- git-revision-date-localized:
    enable_creation_date: true
    type: date
- minify:
    minify_html: true
    minify_js: true
    minify_css: true
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight
- toc:
    permalink: true
edit_uri: edit/main/docs/
nav:
- Home: index.md
