[project]
name = "reference-lib"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mkdocs-material>=9.7.7",
    "mkdocs-roamlinks-plugin>=0.3.2",
    "pyyaml>=6.0.3",
    "ruff>=0.16.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "types-pyyaml>=6.0.12.20260724",
]

[project.scripts]
new-note = "scripts.new_note:main"
build-nav = "scripts.build_nav:main"
init-categories = "scripts.init_categories:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["scripts"]